name: TCPlayback
options:
  bundleIdPrefix: com.pixelhaus
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 525PKJRCD9
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TCKit:
    path: Packages/TCKit
targets:
  TCPlayback:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelhaus.tcplayback
        PRODUCT_NAME: TCPlayback
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "TC Playback"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TC Playback listens to the audio input only when you choose to read external timecode."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PIXEL HAUS"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: App/Resources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: "TC Playback"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
  TCPlaybackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: TCPlayback
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TCPlayback:
    build:
      targets:
        TCPlayback: all
        TCPlaybackTests: [test]
    test:
      targets: [TCPlaybackTests]
